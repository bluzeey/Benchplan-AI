"$schema" = "https://railway.app/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - --error-logfile - --log-level info"
preDeployCommand = ["echo 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres;' | python manage.py dbshell && python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
healthcheckPath = "/api/health/"
healthcheckTimeout = 120
healthcheckInterval = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
DJANGO_SETTINGS_MODULE = "config.settings"
