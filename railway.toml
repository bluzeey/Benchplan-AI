"$schema" = "https://railway.app/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - --error-logfile - --log-level info"
preDeployCommand = ["python -c 'import psycopg2,os;conn=psycopg2.connect(os.getenv(\"DATABASE_URL\"));cur=conn.cursor();cur.execute(\"DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres;\");conn.commit();cur.close();conn.close();print(\"DB reset\")' && python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
healthcheckPath = "/api/health/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckTimeout = 120
healthcheckInterval = 15

[deploy.env]
DJANGO_SETTINGS_MODULE = "config.settings"
